name: Scan Release Assets with VirusTotal

on:
  release:
    types: [published]

jobs:
  virustotal:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: VirusTotal Scan
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          update_release_body: true
          request_rate: 4
          files: |
            .exe$
            .zip$
            .tar.gz$
            .tar.zst$
            .AppImage$
            .dmg$

