name: Komodo Wallet Desktop Release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID from atomicdex-desktop-ci.yml to publish"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    name: Publish desktop release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Validate the source CI run
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.build_run_id }}")"
          conclusion="$(jq -r '.conclusion' <<<"$json")"
          workflow_path="$(jq -r '.path' <<<"$json")"
          head_sha="$(jq -r '.head_sha' <<<"$json")"

          if [[ "$workflow_path" != ".github/workflows/atomicdex-desktop-ci.yml" ]]; then
            echo "Selected run is not atomicdex-desktop-ci.yml: $workflow_path" >&2
            exit 1
          fi

          if [[ "$conclusion" != "success" ]]; then
            echo "Selected CI run did not succeed: $conclusion" >&2
            exit 1
          fi

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Read release version
        id: version
        run: |
          version="$(jq -r '."version-string"' vcpkg.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Download artifacts from the selected CI run
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id }}
          pattern: '*'
          merge-multiple: false
          skip-decompress: true
          path: downloaded

      - name: Select non-debug assets and normalize filenames
        shell: bash
        run: |
          mkdir -p release-assets

          echo "Downloaded artifact files:"
          find downloaded -type f -printf '%P\n' | sort

          count=0
          while IFS= read -r -d '' file; do
            filename="${file##*/}"

            # Exclude every debug artifact; keep all supported release assets.
            [[ "$filename" == *debug* ]] && continue

            if [[ "$filename" =~ ^(.+)-release(-installer)?-([[:xdigit:]]+)(\.(tar\.zst|AppImage|zip|dmg|exe))$ ]]; then
              clean_name="${BASH_REMATCH[1]}${BASH_REMATCH[2]}${BASH_REMATCH[4]}"
              cp -- "$file" "release-assets/$clean_name"
              echo "Prepared: $filename -> $clean_name"
              count=$((count + 1))
            else
              echo "Skipped: $filename"
            fi
          done < <(find downloaded -type f -print0)

          if (( count == 0 )); then
            echo "::error::No release assets found."
            exit 1
          fi

          echo "Assets prepared for release:"
          ls -l release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if ! ls release-assets/* >/dev/null 2>&1; then
            echo "No release assets found; aborting." >&2
            exit 1
          fi

          gh release create "${{ steps.version.outputs.tag }}" release-assets/* \
            --target "${{ steps.ci.outputs.head_sha }}" \
            --title "Komodo Wallet ${{ steps.version.outputs.version }}" \
            --generate-notes

